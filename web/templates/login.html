{{define "login"}}<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · s2s</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="centered">
<form class="card login" method="post" action="/login">
  <h1>s2s<span>issuer</span></h1>
  <p class="muted">Operator sign-in. Machine credentials do not work here.</p>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <label>Email<input type="email" name="email" required autofocus autocomplete="username"></label>
  <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
</body>
</html>{{end}}
