# Container names and ports are prefixed to avoid colliding with anything else
# running on the same machine.
name: rotating-s2s

services:
  mysql:
    image: mysql:8.0
    container_name: rotating-s2s-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: s2s
      MYSQL_USER: s2s
      MYSQL_PASSWORD: s2spw
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpw"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - rotating-s2s-mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: rotating-s2s-redis
    # Pure cache: no persistence, and volatile-lru as a memory backstop.
    # Eviction is always safe here because every tier below the cache is
    # authoritative -- an evicted entry falls through to MySQL and gets the
    # true state, including "revoked".
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --maxmemory-samples 10
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  issuer:
    build:
      context: ..
      dockerfile: Dockerfile
    image: s2s-issuer:local
    container_name: rotating-s2s-issuer
    # Behind the `app` profile so `make up` still starts dependencies only --
    # local development runs the binary on the host for a one-second rebuild.
    # `docker compose --profile app up` runs the whole stack instead.
    profiles: ["app"]
    depends_on:
      mysql:   { condition: service_healthy }
      redis:   { condition: service_healthy }
    environment:
      # Service names, not 127.0.0.1: inside the compose network the
      # containers resolve each other by name on their real ports.
      S2S_MYSQL_DSN: "s2s:s2spw@tcp(mysql:3306)/s2s?parseTime=true&multiStatements=true&loc=UTC"
      S2S_REDIS_ADDR: "redis:6379"
      S2S_SERVER_ADMIN_API_KEY: "${S2S_SERVER_ADMIN_API_KEY:-dev-admin-key-change-me}"
      S2S_SERVER_SECURE_COOKIES: "false"
      S2S_LOG_FORMAT: "json"
    ports:
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD", "./s2s", "--help"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  rotating-s2s-mysql-data:
